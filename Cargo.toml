[package]
name = "proclens"
version = "0.1.0"
edition = "2021"
description = "Pure userspace process inspector — Rust port of ProcLens"
license = "MIT"
rust-version = "1.75"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
nix = { version = "0.27", features = ["process", "sched", "signal"] }
libc = "0.2"
crossterm = "0.27"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
